name: Validate ASCII contribution
on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate ASCII file
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD)
          echo "Changed files: $CHANGED"
          # Must only touch ascii/ folder
          echo "$CHANGED" | grep -E '^ascii/[^/]+\.txt$' || { echo "Invalid path"; exit 1; }
          # Check size and characters
          for f in $CHANGED; do
            [ $(wc -l < "$f") -le 100 ] || { echo "$f too many lines"; exit 1; }
            LC_ALL=C grep -q '[^[:print:][:space:]]' "$f" && { echo "$f non-printable chars"; exit 1; }
          done
      - uses: peter-evans/enable-pull-request-automerge@v3
        with:
          merge-method: squash

